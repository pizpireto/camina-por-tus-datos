/* =====================================================================
   UTILIDADES
   ===================================================================== */
const q = s => document.querySelector(s);
const lerp = (a, b, t) => a + (b - a) * t;

function num(n, dec) {
  const neg = n < 0;
  const [ent, frac] = Math.abs(n).toFixed(dec).split('.');
  const miles = ent.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return (neg ? '-' : '') + (frac ? miles + ',' + frac : miles);
}
const money  = m => '$' + num(m, 1) + ' M';
const flecha = (v, dec = 0) => (v >= 0 ? '▲ ' : '▼ ') + num(Math.abs(v), dec) + '%';
const colorMora = m => m < 2.5 ? '#2bb673' : (m <= 4 ? '#f2b33d' : '#ef6b5b');
const suma = (arr, f) => arr.reduce((a, z) => a + f(z), 0);

const EASE = {
  lineal:  p => p,
  suave:   p => p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2,
  entrada: p => p * p * p,
  salida:  p => 1 - Math.pow(1 - p, 3),
  rebote:  p => { const c1 = 1.4, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); }
};

function rr(g, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}

function crear(tag, attrs, padre) {
  const e = document.createElement(tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (padre) padre.appendChild(e);
  return e;
}

function refrescarRayos() {
  document.querySelectorAll('[raycaster]').forEach(e => {
    const r = e.components && e.components.raycaster;
    if (r) r.refreshObjects();
  });
}

/* =====================================================================
   SONIDO (generado en el navegador, sin archivos)
   ===================================================================== */
const Sonido = {
  ctx: null, intervalo: null, notas: [], quiereCaos: false,
  activar() {
    try {
      if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (this.ctx.state === 'suspended') this.ctx.resume();
      if (this.quiereCaos && !this.intervalo) this._iniciarCaos();
    } catch (e) { /* sin audio, la escena sigue funcionando */ }
  },
  tono(f, ini, dur, vol, tipo) {
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = tipo || 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0, ini);
    g.gain.linearRampToValueAtTime(vol, ini + 0.03);
    g.gain.setValueAtTime(vol, ini + dur - 0.05);
    g.gain.linearRampToValueAtTime(0, ini + dur);
    o.connect(g).connect(c.destination);
    o.start(ini); o.stop(ini + dur + 0.05);
    this.notas.push(o);
    o.onended = () => { this.notas = this.notas.filter(n => n !== o); };
  },
  timbre() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    [0, 0.55].forEach(k => { this.tono(440, t + k, 0.4, 0.035); this.tono(480, t + k, 0.4, 0.035); });
  },
  alerta() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    this.tono(988, t, 0.12, 0.022, 'square');
    this.tono(784, t + 0.15, 0.12, 0.022, 'square');
  },
  caos() { this.quiereCaos = true; if (this.ctx && !this.intervalo) this._iniciarCaos(); },
  _iniciarCaos() {
    let n = 0;
    this.timbre();
    this.intervalo = setInterval(() => { n++; (n % 2) ? this.alerta() : this.timbre(); }, 1900);
  },
  detener() {
    this.quiereCaos = false;
    clearInterval(this.intervalo); this.intervalo = null;
    this.notas.forEach(o => { try { o.stop(); } catch (e) {} });
    this.notas = [];
  },
  calma() {
    const c = this.ctx; if (!c) return;
    const t = c.currentTime + 0.2;
    [261.63, 329.63, 392.0, 523.25].forEach((f, i) => {
      const o = c.createOscillator(), g = c.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.022, t + 2.5 + i * 0.3);
      g.gain.setValueAtTime(0.022, t + 6);
      g.gain.linearRampToValueAtTime(0, t + 10);
      o.connect(g).connect(c.destination);
      o.start(t); o.stop(t + 10.2);
      this.notas.push(o);
    });
  }
};
document.addEventListener('click', () => Sonido.activar());

/* Panel de texto dibujado en canvas (soporta tildes, ñ, ¿, ▲).
   Marcas al inicio de cada línea:  # título  * destacado  ^ verde  % ámbar  ! rojo  ~ nota pequeña
   Las líneas se separan con "|". */
AFRAME.registerComponent('etiqueta', {
  schema: {
    texto:   { type: 'string', default: '' },
    ancho:   { type: 'number', default: 1 },
    alto:    { type: 'number', default: 0.4 },
    fondo:   { type: 'string', default: 'rgba(255,255,255,0.94)' },
    borde:   { type: 'string', default: '' },
    color:   { type: 'string', default: '#1d2b36' },
    acento:  { type: 'string', default: '#0b6fa4' },
    tam:     { type: 'number', default: 40 },
    alinear: { type: 'string', default: 'center' },
    radio:   { type: 'number', default: 26 }
  },
  update() {
    const d = this.data;
    const ppm = Math.min(640, 2048 / Math.max(d.ancho, d.alto));
    const k = ppm / 640;
    const cw = Math.round(d.ancho * ppm), ch = Math.round(d.alto * ppm);
    const c = document.createElement('canvas'); c.width = cw; c.height = ch;
    const g = c.getContext('2d');

    if (d.fondo !== 'none') {
      rr(g, 3, 3, cw - 6, ch - 6, d.radio * k);
      g.fillStyle = d.fondo; g.fill();
      if (d.borde) { g.lineWidth = 6 * k; g.strokeStyle = d.borde; g.stroke(); }
    }

    const COL = { '#': d.acento, '*': d.color, '^': '#1f9d61', '%': '#c98a12', '!': '#d93a2b', '~': d.color };
    const lineas = d.texto.split('|').map(l => {
      const m = l.charAt(0);
      let t = l, s = d.tam, w = 500, col = d.color, a = 1;
      if ('#*^%!~'.includes(m) && m !== '') {
        t = l.slice(1); col = COL[m]; w = 700;
        if (m === '#') s = d.tam * 1.25;
        if (m === '*') s = d.tam * 1.15;
        if (m === '~') { s = d.tam * 0.75; w = 400; a = 0.72; }
      }
      return { t, s: s * k, w, col, a };
    });

    const gap = 0.32;
    const total = lineas.reduce((acc, l, i) => acc + l.s + (i ? l.s * gap : 0), 0);
    let y = (ch - total) / 2;
    const pad = cw * 0.05;
    lineas.forEach((l, i) => {
      if (i) y += l.s * gap;
      g.font = `${l.w} ${l.s}px system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif`;
      g.fillStyle = l.col; g.globalAlpha = l.a;
      g.textBaseline = 'top'; g.textAlign = d.alinear;
      const x = d.alinear === 'left' ? pad : (d.alinear === 'right' ? cw - pad : cw / 2);
      g.fillText(l.t, x, y, cw - 2 * pad);
      y += l.s;
    });
    g.globalAlpha = 1;

    const tex = new THREE.CanvasTexture(c);
    if (THREE.SRGBColorSpace) tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = 4;
    const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, alphaTest: 0.02, side: THREE.DoubleSide });
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(d.ancho, d.alto), mat);
    this.limpiar();
    this.mesh = mesh;
    this.el.setObject3D('mesh', mesh);
  },
  limpiar() {
    if (!this.mesh) return;
    this.el.removeObject3D('mesh');
    this.mesh.geometry.dispose();
    this.mesh.material.map.dispose();
    this.mesh.material.dispose();
    this.mesh = null;
  },
  remove() { this.limpiar(); }
});

/* Hace que un panel gire para mirar siempre al visitante */
const _v1 = new THREE.Vector3(), _v2 = new THREE.Vector3();
AFRAME.registerComponent('mirar', {
  tick() {
    const cam = this.el.sceneEl.camera; if (!cam) return;
    cam.getWorldPosition(_v1);
    this.el.object3D.getWorldPosition(_v2);
    _v1.y = _v2.y;
    this.el.object3D.lookAt(_v1);
  }
});

/* Joystick izquierdo: caminar en la dirección en que se mira */
AFRAME.registerComponent('mover', {
  schema: { rig: { type: 'selector' }, vel: { default: 1.8 } },
  init() {
    this.ejes = { x: 0, y: 0 };
    this.dir = new THREE.Vector3(); this.der = new THREE.Vector3();
    this.el.addEventListener('thumbstickmoved', e => { this.ejes.x = e.detail.x; this.ejes.y = e.detail.y; });
  },
  tick(t, dt) {
    const { x, y } = this.ejes;
    if (Math.abs(x) < 0.15 && Math.abs(y) < 0.15) return;
    const cam = this.el.sceneEl.camera; if (!cam || !this.data.rig) return;
    cam.getWorldDirection(this.dir); this.dir.y = 0;
    if (this.dir.lengthSq() < 1e-4) return;
    this.dir.normalize();
    this.der.set(-this.dir.z, 0, this.dir.x);
    const s = this.data.vel * Math.min(dt || 16, 100) / 1000;
    const p = this.data.rig.object3D.position;
    p.addScaledVector(this.dir, -y * s);
    p.addScaledVector(this.der, x * s);
  }
});

/* Joystick derecho: giro de 30° (evita mareo) */
AFRAME.registerComponent('giro', {
  schema: { rig: { type: 'selector' }, grados: { default: 30 } },
  init() {
    this.listo = true;
    this.p1 = new THREE.Vector3(); this.p2 = new THREE.Vector3();
    this.el.addEventListener('thumbstickmoved', e => {
      const x = e.detail.x;
      if (Math.abs(x) < 0.3) { this.listo = true; return; }
      if (this.listo && Math.abs(x) > 0.7) { this.listo = false; this.girar(x > 0 ? -1 : 1); }
    });
  },
  girar(sentido) {
    const rig = this.data.rig.object3D, cam = this.el.sceneEl.camera;
    cam.getWorldPosition(this.p1);
    rig.rotation.y += sentido * THREE.MathUtils.degToRad(this.data.grados);
    rig.updateMatrixWorld(true);
    cam.getWorldPosition(this.p2);
    rig.position.x += this.p1.x - this.p2.x;
    rig.position.z += this.p1.z - this.p2.z;
  }
});

/* =====================================================================
   DIRECTOR DE LA EXPERIENCIA: caos → transición → orden
   ===================================================================== */
AFRAME.registerComponent('director', {
  init() {
    this.estado = 'inicio';
    this.tweens = []; this.timers = [];
    this.listo = false;
    if (this.el.hasLoaded) this.setup();
    else this.el.addEventListener('loaded', () => this.setup());
  },

  setup() {
    this.$ = {
      caos: q('#caos'), orden: q('#orden'), rig: q('#rig'), cielo: q('#cielo'), piso: q('#piso'),
      amb: q('#luzAmb'), dir: q('#luzDir'), alerta: q('#luzAlerta')
    };
    this.paleta = {
      caos:  { amb: new THREE.Color('#ff9a8a'), ambI: 0.35, dirI: 0.15, alerta: 1.4,
               cielo: new THREE.Color('#1b1416'), densidad: 0.14, piso: new THREE.Color('#2a2224') },
      orden: { amb: new THREE.Color('#ffffff'), ambI: 0.5, dirI: 0.7, alerta: 0,
               cielo: new THREE.Color('#dcebf5'), densidad: 0.012, piso: new THREE.Color('#dfe7ec') }
    };

    this.crearBotones();
    this.construirOrden();
    this.construirCaos();
    this.setAmbiente(0);

    ['#manoIzq', '#manoDer'].forEach(sel => {
      const m = q(sel);
      ['abuttondown', 'xbuttondown'].forEach(ev => m.addEventListener(ev, () => this.avanzar()));
      m.addEventListener('triggerdown', () => Sonido.activar());
    });
    this.el.addEventListener('enter-vr', () => {
      Sonido.activar();
      if (this.estado === 'caos') this.programarCaos();
    });

    this.listo = true;
    this.empezarCaos();
  },

  /* ---------- utilidades de animación ---------- */
  tween(o) { this.tweens.push(Object.assign({ t: 0, delay: 0, dur: 1000, ease: EASE.lineal }, o)); },
  timer(ms, fin) { this.timers.push({ t: 0, delay: ms, fin }); },

  setAmbiente(t) {
    const A = this.paleta.caos, B = this.paleta.orden, $ = this.$;
    const amb = $.amb.getObject3D('light');
    if (amb) { amb.color.copy(A.amb).lerp(B.amb, t); amb.intensity = lerp(A.ambI, B.ambI, t); }
    const dl = $.dir.getObject3D('light');
    if (dl) dl.intensity = lerp(A.dirI, B.dirI, t);
    this.alertaBase = lerp(A.alerta, B.alerta, t);
    const sky = $.cielo.getObject3D('mesh');
    if (sky) sky.material.color.copy(A.cielo).lerp(B.cielo, t);
    const fog = this.el.object3D.fog;
    if (fog) { fog.color.copy(A.cielo).lerp(B.cielo, t); fog.density = lerp(A.densidad, B.densidad, t); }
    const piso = $.piso.getObject3D('mesh');
    if (piso) piso.material.color.copy(A.piso).lerp(B.piso, t);
  },

  mostrar(b, on) {
    b.object3D.visible = on;
    b.classList.toggle('clickable', on);
    b.hover = false;
    refrescarRayos();
  },

  /* ---------- botones ---------- */
  crearBotones() {
    const s = this.el;
    this.btnOrdenar = crear('a-entity', { position: '0 1.2 -1.5', rotation: '-8 0 0' }, s);
    this.btnOrdenar.setAttribute('etiqueta', {
      texto: '*Ordenar mis datos|~Apunta aquí y presiona el gatillo',
      ancho: 1.05, alto: 0.34, fondo: '#0b6fa4', borde: '#7fd3ff', color: '#ffffff', tam: 44
    });
    this.btnReiniciar = crear('a-entity', { position: '1.0 0.95 -1.0', rotation: '-8 -40 0' }, s);
    this.btnReiniciar.setAttribute('etiqueta', {
      texto: '*Volver a empezar|~Para el siguiente visitante',
      ancho: 0.85, alto: 0.3, fondo: '#2b3c4b', borde: '#9fb3c3', color: '#ffffff', tam: 40
    });
    [this.btnOrdenar, this.btnReiniciar].forEach(b => {
      b.object3D.visible = false;
      b.addEventListener('raycaster-intersected', () => { b.hover = true; });
      b.addEventListener('raycaster-intersected-cleared', () => { b.hover = false; });
    });
    this.btnOrdenar.addEventListener('click', () => { if (this.btnOrdenar.object3D.visible) { Sonido.activar(); this.ordenar(); } });
    this.btnReiniciar.addEventListener('click', () => { if (this.btnReiniciar.object3D.visible) this.reiniciar(); });
  },

  /* ---------- ACTO 1: el caos ---------- */
  construirCaos() {
    const g = this.$.caos, R = Math.random;
    this.papeles = []; this.pantallas = []; this.mensajes = [];

    // Hojas de papel volando y regadas en el piso
    for (let i = 0; i < 70; i++) {
      const enPiso = i < 16;
      const ang = R() * Math.PI * 2;
      const rad = enPiso ? 0.8 + R() * 3.5 : 1.3 + R() * 3.4;
      const y = enPiso ? 0.012 + i * 0.0006 : 0.3 + R() * 2.9;
      const p = crear('a-entity', {
        position: `${Math.sin(ang) * rad} ${y} ${-Math.cos(ang) * rad}`,
        rotation: enPiso ? `-90 ${R() * 360} 0` : `${R() * 360} ${R() * 360} ${R() * 360}`
      }, g);
      p.setAttribute('geometry', { primitive: 'plane', width: 0.21, height: 0.297 });
      p.setAttribute('material', { color: R() < 0.15 ? '#fff4a3' : '#f2eee6', side: 'double', roughness: 1 });
      this.papeles.push({ el: p, flota: !enPiso, baseY: y, fase: R() * 6.28,
                          rv: [(R() - .5) * 0.9, (R() - .5) * 0.9, (R() - .5) * 0.6] });
    }

    // Notas adhesivas
    const notas = ['!¿$3,9 M?', '*¡Revisar!', '!#¡REF!', '*v2 FINAL', '!URGENTE', '*Cuadrar con contabilidad',
                   '!¿Mora 5%?', '*Llamar a sistemas', '!No cuadra', '*¿Cuál es la buena?'];
    notas.forEach((t, i) => {
      const ang = (i / notas.length) * Math.PI * 2 + R() * 0.4, rad = 1.4 + R() * 1.8, y = 0.6 + R() * 2.2;
      const n = crear('a-entity', {
        position: `${Math.sin(ang) * rad} ${y} ${-Math.cos(ang) * rad}`,
        rotation: `${(R() - .5) * 40} ${-ang * 180 / Math.PI} ${(R() - .5) * 40}`
      }, g);
      n.setAttribute('etiqueta', { texto: t, ancho: 0.34, alto: 0.26, fondo: '#fff27a', color: '#3a3a3a', tam: 30, radio: 6 });
      this.papeles.push({ el: n, flota: true, baseY: y, fase: R() * 6.28,
                          rv: [(R() - .5) * 0.25, (R() - .5) * 0.25, (R() - .5) * 0.25] });
    });

    // Pantallas con Excels rotos
    const contenidos = [
      ['#Colocaciones_FINAL_v3_ahora_si.xlsx', 'Zona          Monto          Mora', '!Norte        #¡REF!         #N/D', '!Sur            #¡REF!         #N/D', '~Última edición: ¿quién?'],
      ['#Cartera Norte (2) - copia.xlsx', 'Total norte:', '!¿$3,9 M?   ¿$4,4 M?   ¿$8,3 M?', '~Tres versiones distintas del mismo dato'],
      ['#Reporte_gerencia_OCT_borrador.xlsx', '!#¡DIV/0!', 'Morosidad promedio: ???', '~Pendiente: cruzar con el sistema'],
      ['#BASE_CREDITOS_no_tocar.xlsx', 'Fila 18.402 de 18.402', '!El archivo no responde', '~Guardando… (no cierre la ventana)'],
      ['#Morosidad_sur_revisar.xlsx', 'Fuente: ¿?', 'Actualizado: ¿?', '!Las cifras no cuadran'],
      ['#Copia de Copia de Indicadores.xlsx', '!#¡VALOR!     #N/D     #¡REF!', '~Vínculos externos rotos (14)']
    ];
    [-140, -95, -50, 50, 95, 140].forEach((a, i) => {
      const r = 2.7, rad = a * Math.PI / 180, y = 1.45 + (i % 2) * 0.35;
      const grupo = crear('a-entity', {
        position: `${Math.sin(rad) * r} ${y} ${-Math.cos(rad) * r}`,
        rotation: `0 ${-a} 0`
      }, g);
      const marco = crear('a-entity', { position: '0 0 -0.04' }, grupo);
      marco.setAttribute('geometry', { primitive: 'box', width: 1.42, height: 0.92, depth: 0.06 });
      marco.setAttribute('material', { color: '#111317', roughness: 0.6 });
      const pant = crear('a-entity', { position: '0 0 0.001' }, grupo);
      pant.setAttribute('etiqueta', {
        texto: contenidos[i].join('|'), ancho: 1.32, alto: 0.82, fondo: '#f4f6f4',
        color: '#2d2d2d', acento: '#1d6f42', tam: 34, radio: 6, alinear: 'left'
      });
      this.pantallas.push({ el: grupo, fase: R() * 10 });
    });

    // La pregunta que nadie puede responder
    const preg = crear('a-entity', { position: '0 2.3 -3.0' }, g);
    preg.setAttribute('etiqueta', {
      texto: '*¿Cuánto colocamos en el norte este mes?|~Gerencia lo pregunta. Nadie tiene la cifra.',
      ancho: 2.6, alto: 0.6, fondo: 'rgba(70,8,8,0.92)', borde: '#ff4d3d', color: '#ffffff', tam: 54
    });
    this.pantallas.push({ el: preg, fase: R() * 10 });

    // Mensajes de presión girando alrededor
    const msgs = ['Gerencia necesita las cifras HOY', 'Estas cifras no cuadran con las de ayer',
                  '¿Quién tiene la última versión?', 'El sistema no exporta: toca hacerlo a mano',
                  '¿Por qué sube la mora en el sur?', 'Reunión de directorio en 15 minutos',
                  'Te reenvío el Excel… otra vez'];
    msgs.forEach((t, i) => {
      const m = crear('a-entity', {}, g);
      m.setAttribute('etiqueta', {
        texto: '*' + t, ancho: 1.6, alto: 0.26, fondo: 'rgba(55,12,12,0.9)',
        borde: '#ff5a4a', color: '#ffe1dc', tam: 36, radio: 40
      });
      m.setAttribute('mirar', '');
      const datos = { el: m, ang: (i / msgs.length) * Math.PI * 2, r: 1.9 + R() * 0.6,
                      y: 1.3 + R() * 1.2, vel: (i % 2 ? 1 : -1) * (0.06 + R() * 0.06), fase: R() * 6 };
      this.colocarMensaje(datos, 0);
      this.mensajes.push(datos);
    });
    refrescarRayos();
  },

  colocarMensaje(m, t) {
    m.el.object3D.position.set(Math.sin(m.ang) * m.r, m.y + 0.06 * Math.sin(t * 0.0015 + m.fase), -Math.cos(m.ang) * m.r);
  },

  /* ---------- ACTO 2: el orden ---------- */
  construirOrden() {
    const g = this.$.orden, Z = ZONAS;
    const max = Math.max(...Z.map(z => z.monto));

    // Cálculos del resumen (salen de los datos, no están escritos a mano)
    const tot = suma(Z, z => z.monto);
    const prev = suma(Z, z => z.monto / (1 + z.var / 100));
    const varTot = (tot / prev - 1) * 100;
    const ops = suma(Z, z => z.ops);
    const moraProm = suma(Z, z => z.monto * z.mora) / tot;
    const N = Z.filter(z => z.sector === 'norte');
    const norteTot = suma(N, z => z.monto);
    const norteVar = (norteTot / suma(N, z => z.monto / (1 + z.var / 100)) - 1) * 100;
    const topMora = Z.slice().sort((a, b) => b.mora - a.mora).slice(0, 2);
    const topVar  = Z.slice().sort((a, b) => b.var - a.var).slice(0, 2);

    // Mesa bajo el mapa
    const base = crear('a-entity', { position: '-1.3 0.015 -5.5', rotation: '-90 0 0' }, g);
    base.setAttribute('geometry', { primitive: 'plane', width: 17.5, height: 19 });
    base.setAttribute('material', { color: '#c3d3dd', roughness: 1 });

    // Mapa político del DMQ: cada administración zonal con su color y su borde
    const mapaEl = crear('a-entity', {}, g);
    const grp = new THREE.Group();
    this.matsMapa = [];
    ZONAS.forEach(zn => {
      const gz = GEO[zn.nombre]; if (!gz) return;
      const mat = new THREE.MeshStandardMaterial({ color: zn.color, roughness: 0.9, transparent: true, opacity: 0 });
      const matL = new THREE.LineBasicMaterial({ color: '#ffffff', transparent: true, opacity: 0 });
      this.matsMapa.push({ m: mat, o: 1 }, { m: matL, o: 0.95 });
      gz.poligonos.forEach(poly => {
        const v2 = r => r.map(([x, z]) => new THREE.Vector2(x, -z));
        const shape = new THREE.Shape(v2(poly[0]));
        poly.slice(1).forEach(h => shape.holes.push(new THREE.Path(v2(h))));
        const mesh = new THREE.Mesh(new THREE.ExtrudeGeometry(shape, { depth: 0.04, bevelEnabled: false }), mat);
        mesh.rotation.x = -Math.PI / 2;
        grp.add(mesh);
        poly.forEach(r => {
          const pts = r.map(([x, z]) => new THREE.Vector3(x, 0.042, z));
          grp.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts), matL));
        });
      });
    });
    mapaEl.setObject3D('mesh', grp);

    const tit = crear('a-entity', { position: '0 0.05 -0.9', rotation: '-90 0 0' }, g);
    tit.setAttribute('etiqueta', {

    this.barras = [];
    Z.filter(zn => GEO[zn.nombre]).sort((a, b) => GEO[b.nombre].ancla[1] - GEO[a.nombre].ancla[1]).forEach(zn => {

      });
      et.setAttribute('mirar', '');

    // Panel resumen
    const kpi = crear('a-entity', { position: '-2.7 1.75 -1.2', rotation: '0 62 0' }, g);

        num(ops, 0) + ' operaciones',
        'Morosidad promedio: ' + num(moraProm, 1) + '%',
        '~Una sola fuente de verdad · actualizado hoy 08:00'
      ].join('|'),
      ancho: 1.9, alto: 1.3, tam: 54, alinear: 'left'
    });

    const ley = crear('a-entity', { position: '-2.7 0.8 -1.2', rotation: '0 62 0' }, g);
    ley.setAttribute('etiqueta', {
      texto: ['~Altura = monto colocado · Color = morosidad', '^● Menor a 2,5%', '%● Entre 2,5% y 4%', '!● Mayor a 4%'].join('|'),
      ancho: 1.9, alto: 0.62, tam: 38, alinear: 'left'
    });

    // Panel de respuestas: contesta lo que el caos preguntaba
    const resp = crear('a-entity', { position: '2.7 1.75 -1.0', rotation: '0 -66 0' }, g);
    resp.setAttribute('etiqueta', {
      texto: [
        '#Respuestas, no archivos',
        '¿Cuánto colocamos en el norte?',
        '*' + money(norteTot) + '  ·  ' + flecha(norteVar, 1) + ' vs ' + CONFIG.periodoAnterior,
        '¿Dónde preocupa la mora?',
        '!' + topMora.map(z => z.nombre + ' ' + num(z.mora, 1) + '%').join('  ·  '),
        '¿Dónde crecemos más?',
        '^' + topVar.map(z => z.nombre + ' ▲' + num(z.var, 0) + '%').join('  ·  ')
      ].join('|'),
      ancho: 2.0, alto: 1.5, tam: 46, alinear: 'left'
    });

    // Lema final
    const lineasLema = ['#' + CONFIG.titulo, '*' + CONFIG.lema];
    if (CONFIG.marca) lineasLema.push(CONFIG.marca);
    lineasLema.push('~Datos ficticios con fines demostrativos');
    const lema = crear('a-entity', { position: '0 4.0 -10.5' }, g);
    lema.setAttribute('etiqueta', {
      texto: lineasLema.join('|'), ancho: 5.2, alto: 1.3,
      fondo: 'rgba(255,255,255,0.8)', color: '#0f2a3d', tam: 105, radio: 40
    });

    this.paneles = [tit, norte, kpi, ley, resp, lema];
    this.paneles.forEach(p => p.object3D.scale.setScalar(0.001));
  },

  /* ---------- flujo ---------- */
  empezarCaos() {
    this.estado = 'caos';
    this.mostrar(this.btnOrdenar, false);
    this.mostrar(this.btnReiniciar, false);
    this.programarCaos();
    Sonido.caos();
  },

  programarCaos() {
    this.timers = [];
    this.timer(CONFIG.mostrarBotonTras * 1000, () => { if (this.estado === 'caos') this.mostrar(this.btnOrdenar, true); });
    if (CONFIG.ordenAutomaticoTras > 0)
      this.timer(CONFIG.ordenAutomaticoTras * 1000, () => { if (this.estado === 'caos') this.ordenar(); });
  },

  ordenar() {
    if (this.estado !== 'caos') return;
    this.estado = 'transicion';
    this.mostrar(this.btnOrdenar, false);
    this.timers = [];
    Sonido.detener(); Sonido.calma();
    const R = Math.random;

    // El caos sale volando
    Array.from(this.$.caos.children).forEach(el => {
      const o = el.object3D, p0 = o.position.clone(), s0 = o.scale.x;
      const dir = new THREE.Vector3(p0.x, 0, p0.z);
      if (dir.lengthSq() < 0.01) dir.set(R() - .5, 0, R() - .5);
      dir.normalize();
      const dist = 4 + R() * 5, sube = 1.5 + R() * 3;
      this.tween({ delay: R() * 500, dur: 1400 + R() * 600, ease: EASE.entrada, fn: e => {
        o.position.set(p0.x + dir.x * dist * e, p0.y + sube * e, p0.z + dir.z * dist * e);
        o.scale.setScalar(Math.max(0.001, s0 * (1 - e)));
      }});
    });
    this.timer(2400, () => {
      const c = this.$.caos;
      while (c.firstChild) c.removeChild(c.firstChild);
      this.papeles = []; this.pantallas = []; this.mensajes = [];
    });

    // La luz cambia
    this.tween({ delay: 300, dur: 2600, ease: EASE.suave, fn: e => this.setAmbiente(e) });

    // Aparece el orden
    this.timer(1200, () => {
      this.$.orden.object3D.visible = true;
      this.tween({ dur: 1200, ease: EASE.suave, fn: e => this.matsMapa.forEach(x => { x.m.opacity = x.o * e; }),
                   fin: () => this.matsMapa.forEach(x => { if (x.o === 1) { x.m.transparent = false; x.m.needsUpdate = true; } }) });
      this.barras.forEach((b, i) => {
        this.tween({ delay: 700 + i * 180, dur: 1100, ease: EASE.rebote,
                     fn: e => b.ancla.object3D.scale.set(1, Math.max(0.001, e), 1) });
        this.tween({ delay: 700 + i * 180 + 700, dur: 500, ease: EASE.salida,
                     fn: e => b.et.object3D.scale.setScalar(Math.max(0.001, e)) });
      });
      this.paneles.forEach((p, i) => this.tween({ delay: 1800 + i * 250, dur: 700, ease: EASE.salida,
                     fn: e => p.object3D.scale.setScalar(Math.max(0.001, e)) }));
    });
    this.timer(4500, () => { this.estado = 'orden'; });
    this.timer(8000, () => { if (this.estado === 'orden') this.mostrar(this.btnReiniciar, true); });
  },

  reiniciar() {
    if (this.estado !== 'orden') return;
    this.tweens = []; this.timers = [];
    Sonido.detener();
    this.$.orden.object3D.visible = false;
    this.barras.forEach(b => { b.ancla.object3D.scale.set(1, 0.001, 1); b.et.object3D.scale.setScalar(0.001); });
    this.paneles.forEach(p => p.object3D.scale.setScalar(0.001));
    this.matsMapa.forEach(x => { x.m.transparent = true; x.m.opacity = 0; x.m.needsUpdate = true; });
    const rig = this.$.rig.object3D;
    rig.position.set(0, 0, 0); rig.rotation.set(0, 0, 0);
    this.setAmbiente(0);
    this.construirCaos();
    this.empezarCaos();
  },

  avanzar() {
    Sonido.activar();
    if (this.estado === 'caos') this.ordenar();
    else if (this.estado === 'orden') this.reiniciar();
  },

  tick(t, dt) {
    if (!this.listo) return;
    dt = Math.min(dt || 16, 100);

    for (let i = this.timers.length - 1; i >= 0; i--) {
      const tm = this.timers[i]; tm.t += dt;
      if (tm.t >= tm.delay) { this.timers.splice(i, 1); tm.fin(); }
    }
    for (let i = this.tweens.length - 1; i >= 0; i--) {
      const tw = this.tweens[i]; tw.t += dt;
      if (tw.t < tw.delay) continue;
      const p = Math.min(1, (tw.t - tw.delay) / tw.dur);
      tw.fn(tw.ease(p));
      if (p >= 1) { this.tweens.splice(i, 1); if (tw.fin) tw.fin(); }
    }

    if (this.estado === 'caos' || this.estado === 'transicion') {
      const luz = this.$.alerta.getObject3D('light');
      if (luz) luz.intensity = this.alertaBase * (0.55 + 0.45 * Math.sin(t * 0.006));
    }

    if (this.estado === 'caos') {
      const s = dt / 1000;
      this.papeles.forEach(p => {
        if (!p.flota) return;
        const o = p.el.object3D;
        o.rotation.x += p.rv[0] * s; o.rotation.y += p.rv[1] * s; o.rotation.z += p.rv[2] * s;
        o.position.y = p.baseY + 0.1 * Math.sin(t * 0.0011 + p.fase);
      });
      this.pantallas.forEach(p => {
        const sacude = Math.sin(t * 0.0009 + p.fase) > 0.75;
        p.el.object3D.rotation.z = sacude ? Math.sin(t * 0.05) * 0.025 : 0;
      });
      this.mensajes.forEach(m => { m.ang += m.vel * s; this.colocarMensaje(m, t); });
      const b = this.btnOrdenar;
      if (b.object3D.visible) b.object3D.scale.setScalar((b.hover ? 1.1 : 1) * (1 + 0.035 * Math.sin(t * 0.005)));
    }

    if (this.estado === 'orden') {
      const b = this.btnReiniciar;
      if (b.object3D.visible) b.object3D.scale.setScalar(b.hover ? 1.08 : 1);
    }
  }
});
</script>
</head>

<body>
<div id="ayuda">
  <h1>Camina por tus datos</h1>
  <p><b>En el PC:</b> arrastra con el mouse para mirar, usa W A S D para moverte y haz clic en el botón azul cuando aparezca.</p>
  <p><b>En el Quest 2:</b> abre esta página en el navegador del visor y toca el botón «VR» de la esquina inferior derecha.</p>
  <button onclick="this.parentNode.remove()">Entendido</button>
</div>

<a-scene director
         renderer="antialias: true; foveationLevel: 1"
         fog="type: exponential; color: #1b1416; density: 0.14"
         cursor="rayOrigin: mouse"
         raycaster="objects: .clickable">

  <a-sky id="cielo" color="#1b1416"></a-sky>
  <a-plane id="piso" rotation="-90 0 0" width="60" height="60" color="#2a2224"></a-plane>

  <a-entity id="luzAmb" light="type: ambient; color: #ff9a8a; intensity: 0.35"></a-entity>
  <a-entity id="luzDir" light="type: directional; color: #ffffff; intensity: 0.15" position="2 6 3"></a-entity>
  <a-entity id="luzAlerta" light="type: point; color: #ff2a2a; intensity: 1.4; distance: 12" position="0 3 -1"></a-entity>

  <a-entity id="caos"></a-entity>
  <a-entity id="orden" visible="false"></a-entity>

  <a-entity id="rig">
    <a-entity id="camara" camera look-controls wasd-controls="acceleration: 20" position="0 1.6 0"></a-entity>
    <a-entity id="manoIzq" laser-controls="hand: left"
              raycaster="objects: .clickable; far: 30; lineColor: #7fd3ff; lineOpacity: 0.6"
              mover="rig: #rig"></a-entity>
    <a-entity id="manoDer" laser-controls="hand: right"
              raycaster="objects: .clickable; far: 30; lineColor: #7fd3ff; lineOpacity: 0.6"
              giro="rig: #rig"></a-entity>
  </a-entity>
</a-scene>
</body>
</html>
